[package]
name = "nassau"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]
test = false
doctest = false

[workspace]
members = ["runtime"]
resolver = "3"

[features]
default = ["native"]
codegen = ["dep:cranelift-codegen", "dep:cranelift-control", "dep:cranelift-frontend", "dep:cranelift-module"]
native = ["codegen", "dep:nassau-runtime", "dep:clap", "cranelift-codegen/host-arch", "cranelift-codegen/unwind", "dep:cranelift-jit", "dep:cranelift-native", "dep:cranelift-object", "dep:reedline", "dep:directories", "dep:nu-ansi-term", "dep:crossterm", "miette/fancy"]
web = ["codegen", "dep:clif2wasm", "dep:js-sys", "dep:anyhow", "dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen"]

[[bin]]
name = "nassau"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
nassau-runtime = { path = "runtime", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
miette = { version = "7", features = ["fancy-no-backtrace"] }
thiserror = "2"
cranelift-codegen = { version = "0.136", default-features = false, features = ["std"], optional = true }
cranelift-control = { version = "0.136", optional = true }
cranelift-frontend = { version = "0.136", optional = true }
cranelift-jit = { version = "0.136", optional = true }
cranelift-module = { version = "0.136", optional = true }
cranelift-native = { version = "0.136", optional = true }
cranelift-object = { version = "0.136", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
reedline = { version = "0.52.1", optional = true }
directories = { version = "6", optional = true }
nu-ansi-term = { version = "0.50", optional = true }
crossterm = { version = "0.29", optional = true }

clif2wasm = { git = "https://github.com/Takashiidobe/clif2wasm", rev = "43274bf90f7070da3221f6de924e9bfc11a284d9", optional = true }
anyhow = { version = "1", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
libtest-mimic = "0.8"

[lints.clippy]
large_enum_variant = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
result_large_err = "allow"

[[test]]
name = "fixtures"
harness = false
required-features = ["native"]

[[test]]
name = "repl"
required-features = ["native"]
