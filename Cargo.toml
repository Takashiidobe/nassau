[package]
name = "nassau"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]
test = false
doctest = false

[workspace]
members = ["runtime"]
resolver = "3"

[features]
default = ["native"]
native = ["dep:nassau-runtime", "dep:clap", "dep:cranelift-codegen", "dep:cranelift-control", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native", "dep:cranelift-object", "dep:reedline", "dep:directories", "dep:nu-ansi-term", "miette/fancy"]
web = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen"]

[[bin]]
name = "nassau"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
nassau-runtime = { path = "runtime", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
miette = { version = "7", features = ["fancy-no-backtrace"] }
thiserror = "2"
cranelift-codegen = { version = "0.136", optional = true }
cranelift-control = { version = "0.136", optional = true }
cranelift-frontend = { version = "0.136", optional = true }
cranelift-jit = { version = "0.136", optional = true }
cranelift-module = { version = "0.136", optional = true }
cranelift-native = { version = "0.136", optional = true }
cranelift-object = { version = "0.136", optional = true }
boa_gc = "0.22.0"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
reedline = { version = "0.52.1", optional = true }
directories = { version = "6", optional = true }
nu-ansi-term = { version = "0.50", optional = true }

[dev-dependencies]
libtest-mimic = "0.8"

[lints.clippy]
large_enum_variant = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
result_large_err = "allow"

[[test]]
name = "fixtures"
harness = false
required-features = ["native"]

[[test]]
name = "interpreter-session"
path = "tests/fixtures/runtime/interpreter-session.rs"
harness = false

[[test]]
name = "repl"
required-features = ["native"]
