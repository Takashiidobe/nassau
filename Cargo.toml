[package]
name = "nassau"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["runtime"]
resolver = "3"

[dependencies]
nassau-runtime = { path = "runtime" }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
cranelift-codegen = "0.136"
cranelift-control = "0.136"
cranelift-frontend = "0.136"
cranelift-jit = "0.136"
cranelift-module = "0.136"
cranelift-native = "0.136"
cranelift-object = "0.136"

[dev-dependencies]
libtest-mimic = "0.8"

[lints.clippy]
large_enum_variant = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
result_large_err = "allow"

[[test]]
name = "fixtures"
harness = false
